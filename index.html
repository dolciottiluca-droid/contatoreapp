<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestore Distribuzione Universale</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container" id="app-container">
        <h1>📊 Gestore Distribuzione</h1>

        <!-- BARRA DI NAVIGAZIONE SCHEDE -->
        <div class="tabs-nav">
            <button class="tab-btn active" id="btn-tab-vendite" onclick="mostraScheda('vendite')">📦 Vendite</button>
            <button class="tab-btn" id="btn-tab-acquisti" onclick="mostraScheda('acquisti')">🔒 Acquisti Fornitore</button>
        </div>

        <!-- ========================================== -->
        <!-- SCHEDA 1: VENDITE E DISTRIBUZIONE          -->
        <!-- ========================================== -->
        <div id="scheda-vendite" class="scheda-contenuto active">
            
            <div class="sezione-carico">
                <div class="input-group">
                    <label>Quantità Iniziale:</label>
                    <input type="number" id="quantita-totale" value="20" min="0">
                </div>
                <div class="input-group">
                    <label>Unità (g, kg, L):</label>
                    <input type="text" id="unita-misura" value="g" placeholder="g">
                </div>
                <div class="input-group">
                    <label id="label-prezzo-unitario">Prezzo al g (€):</label>
                    <input type="number" id="prezzo-unitario" value="7.00" step="0.10" min="0">
                </div>
            </div>

            <div class="display-rimanenza">
                <h2>Rimasti: <span id="quantita-rimasta">20</span> <span class="label-unita">g</span></h2>
            </div>

            <h3>Consegne Clienti</h3>

            <!-- CONTENITORE SCORREVOLE CON I 3 CLIENTI INIZIALI -->
            <div id="lista-clienti-scroll" class="lista-clienti-scroll">
                <!-- I 3 clienti vengono creati qui dal codice JavaScript -->
            </div>

            <!-- TASTO AGGIUNGI POSIZIONATO SOTTO I CLIENTI -->
            <button class="btn-aggiungi-sotto" onclick="aggiungiCliente()">+ Aggiungi Cliente</button>

            <!-- SEZIONE CONSUMO PERSONALE -->
            <div class="sezione-personale">
                <h3>🏠 Consumo Personale</h3>
                <div class="cliente-card personale">
                    <span class="nome-cliente">Mio Uso</span>
                    <div class="controlli">
                        <button onclick="cambiaPersonale(-1)">-</button>
                        <span class="qta-box"><span id="qta-personale">0</span> <span class="label-unita">g</span></span>
                        <button onclick="cambiaPersonale(1)">+</button>
                    </div>
                    <div class="tot-badge personale-badge">Uso proprio</div>
                </div>
            </div>

            <button id="btn-azzera" onclick="azzeraTutto()">🗑️ Azzera Conteggi Vendite</button>
        </div>

        <!-- ========================================== -->
        <!-- SCHEDA 2: ACQUISTI DAL FORNITORE (PRIVATA) -->
        <!-- ========================================== -->
        <div id="scheda-acquisti" class="scheda-contenuto">
            <h3>📥 Carico dal Fornitore</h3>
            <p class="sottotitolo-privato">Area riservata al calcolo costi di acquisto.</p>

            <div class="sezione-carico verticale">
                <div class="input-group">
                    <label>Quantità Acquistata (<span class="label-unita">g</span>):</label>
                    <input type="number" id="acq-quantita" value="0" min="0" step="1">
                </div>
                <div class="input-group">
                    <label>Prezzo di Acquisto al <span class="label-unita">g</span> (€):</label>
                    <input type="number" id="acq-prezzo" value="0" min="0" step="0.10">
                </div>
            </div>

            <div class="display-fornitore">
                <span>Totale da versare al Fornitore:</span>
                <h2><span id="acq-totale">0.00</span> €</h2>
            </div>

            <button id="btn-azzera-acq" onclick="azzeraAcquisti()">🗑️ Azzera Acquisto</button>
        </div>

        <p class="suggerimento-swipe">👈 Scorri lateralmente per cambiare scheda 👉</p>
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
