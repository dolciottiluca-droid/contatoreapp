<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestore Distribuzione Universale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">
        <h1>📊 Gestore Distribuzione</h1>
        
        <!-- SEZIONE INPUT INIZIALI (Impostati su g e 7.00€) -->
        <div class="sezione-carico">
            <div class="input-group">
                <label>Quantità Iniziale:</label>
                <input type="number" id="quantita-totale" value="20" min="0">
            </div>
            <div class="input-group">
                <label>Unità (es. kg, L, pezzi):</label>
                <input type="text" id="unita-misura" value="g" placeholder="g">
            </div>
            <div class="input-group">
                <label id="label-prezzo-unitario">Prezzo al g (€):</label>
                <input type="number" id="prezzo-unitario" value="7.00" step="0.10" min="0">
            </div>
        </div>

        <!-- DISPLAY RIMANENZA IN TEMPO REALE -->
        <div class="display-rimanenza">
            <h2>Rimasti: <span id="quantita-rimasta">20</span> <span class="label-unita">g</span></h2>
        </div>

        <!-- LISTA CONSEGNE CLIENTI -->
        <div class="lista-clienti">
            <h3>Consegne Clienti</h3>
            
            <!-- Cliente 1 -->
            <div class="cliente-card">
                <input type="text" class="input-nome-cliente" value="Cliente 1" placeholder="Nome cliente">
                <div class="controlli">
                    <button onclick="cambiaQuantita('cliente1', -1)">-</button>
                    <span id="qta-cliente1" class="quantita">0</span> <span class="label-unita">g</span>
                    <button onclick="cambiaQuantita('cliente1', 1)">+</button>
                </div>
                <div class="totale-pagare">Totale: <span id="prezzo-cliente1">0.00</span> €</div>
            </div>

            <!-- Cliente 2 -->
            <div class="cliente-card">
                <input type="text" class="input-nome-cliente" value="Cliente 2" placeholder="Nome cliente">
                <div class="controlli">
                    <button onclick="cambiaQuantita('cliente2', -1)">-</button>
                    <span id="qta-cliente2" class="quantita">0</span> <span class="label-unita">g</span>
                    <button onclick="cambiaQuantita('cliente2', 1)">+</button>
                </div>
                <div class="totale-pagare">Totale: <span id="prezzo-cliente2">0.00</span> €</div>
            </div>

            <!-- Cliente 3 -->
            <div class="cliente-card">
                <input type="text" class="input-nome-cliente" value="Cliente 3" placeholder="Nome cliente">
                <div class="controlli">
                    <button onclick="cambiaQuantita('cliente3', -1)">-</button>
                    <span id="qta-cliente3" class="quantita">0</span> <span class="label-unita">g</span>
                    <button onclick="cambiaQuantita('cliente3', 1)">+</button>
                </div>
                <div class="totale-pagare">Totale: <span id="prezzo-cliente3">0.00</span> €</div>
            </div>
        </div>

        <!-- SEZIONE CONSUMO PERSONALE -->
        <div class="sezione-personale">
            <h3>🏠 Consumo Personale</h3>
            <div class="cliente-card personale">
                <span class="nome-cliente">Mio Uso</span>
                <div class="controlli">
                    <button onclick="cambiaQuantita('personale', -1)">-</button>
                    <span id="qta-personale" class="quantita">0</span> <span class="label-unita">g</span>
                    <button onclick="cambiaQuantita('personale', 1)">+</button>
                </div>
                <div class="totale-pagare-personale">Uso proprio</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
